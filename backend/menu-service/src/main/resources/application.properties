spring.application.name=menuservice
server.port=8081

# Base de datos H2 en modo archivo: los datos se guardan en ./data/menudb.mv.db
spring.datasource.url=jdbc:h2:file:./data/menudb
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de H2: http://localhost:8081/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

### Base de datos H2 local ###
data/

